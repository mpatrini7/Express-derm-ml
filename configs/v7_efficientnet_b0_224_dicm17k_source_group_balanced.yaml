seed: 2026
model:
  architecture: efficientnet_b0
  pretrained: true
  image_size: 224
training:
  device: auto
  epochs: 25
  batch_size: 32
  learning_rate: 0.0003
  minimum_learning_rate: 0.00001
  weight_decay: 0.0001
  num_workers: 2
  persistent_workers: true
  early_stopping_patience: 7
  selection_metric: pr_auc
  positive_class_weight: none
  source_balanced_sampling:
    source_column: collection_id
    source_groups:
      historical_isic:
        - isic-2020-training
        - isic-2019-challenge-patient-id-subset
      added_dicm17k:
        - isic-dicm-17k-patient-safe-subset
    negative_to_positive_ratio_per_source: 3
  scheduler: cosine
  amp: true
  show_progress: false
data:
  image_column: image_path
  target_column: target
  split_column: split
  positive_label: 1
augmentation:
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_degrees: 180
calibration:
  minimum_sensitivity: 0.90
  minimum_specificity: 0.90
  ece_bins: 10
  minimum_scale: 0.05
  maximum_scale: 20.0
  maximum_abs_bias: 20.0
  development_abstention_margin: 0.0
evaluation:
  bootstrap_samples: 2000
  confidence_level: 0.95
deployment:
  input_name: image
  output_name: logit
  opset: 18
