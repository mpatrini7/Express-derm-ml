seed: 2026
model:
  architecture: efficientnet_b0
  pretrained: true
  image_size: 1024
training:
  device: auto
  epochs: 12
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  minimum_learning_rate: 0.000001
  weight_decay: 0.0001
  num_workers: 2
  persistent_workers: true
  early_stopping_patience: 4
  selection_metric: pr_auc
  positive_class_weight: none
  source_balanced_sampling:
    source_column: collection_id
    source_groups:
      historical_isic_and_priority_negatives:
        - isic-2020-training
        - isic-2019-challenge-patient-id-subset
        - isic-collection-289-msk1-benign-controls
      histopath_mel_nevus:
        - isic-collection-294-histopath-mel-nevus
    negative_to_positive_ratio_per_source: 3
  always_include_negative_collections:
    - isic-collection-289-msk1-benign-controls
  priority_negative_source_column: collection_id
  priority_negative_repeats: 2
  scheduler: cosine
  amp: true
  show_progress: false
  cache_validation_images: false
data:
  image_column: image_path
  target_column: target
  split_column: split
  positive_label: 1
augmentation:
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_degrees: 180
  color_jitter:
    brightness: 0.12
    contrast: 0.12
    saturation: 0.08
    hue: 0.02
calibration:
  minimum_sensitivity: 0.90
  minimum_specificity: 0.90
  ece_bins: 10
  minimum_scale: 0.05
  maximum_scale: 20.0
  maximum_abs_bias: 20.0
  development_abstention_margin: 0.0
evaluation:
  bootstrap_samples: 2000
  confidence_level: 0.95
deployment:
  input_name: image
  output_name: logit
  opset: 18
  preprocessing: opencv_imread_bgr2rgb_inter_area_letterbox_imagenetmean_nchw_float32_v1
