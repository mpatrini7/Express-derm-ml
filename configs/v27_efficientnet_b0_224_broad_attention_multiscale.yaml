seed: 2026
task:
  name: binary_broad_malignancy_attention
  positive_classes:
    - melanoma
    - basal_cell_carcinoma
    - actinic_keratosis
    - squamous_cell_carcinoma
  output_is_not_a_diagnosis: true
model:
  architecture: efficientnet_b0
  pretrained: false
  image_size: 224
training:
  device: auto
  epochs: 12
  batch_size: 32
  learning_rate: 0.00003
  minimum_learning_rate: 0.000001
  weight_decay: 0.0001
  num_workers: 2
  persistent_workers: true
  early_stopping_patience: 4
  selection_metric: pr_auc
  positive_class_weight: none
  negative_to_positive_ratio_per_epoch: 2
  always_include_negative_collections:
    - same_source_benign_control
  priority_negative_source_column: selection_role
  priority_negative_repeats: 1
  scheduler: cosine
  amp: true
  show_progress: false
  cache_validation_images: true
data:
  image_column: image_path
  target_column: target
  split_column: split
  positive_label: 1
augmentation:
  center_crop_scales:
    - 1.0
    - 0.9
    - 0.8
  horizontal_flip_probability: 0.5
  vertical_flip_probability: 0.5
  rotation_degrees: 180
  color_jitter:
    brightness: 0.12
    contrast: 0.12
    saturation: 0.08
    hue: 0.02
calibration:
  minimum_sensitivity: 0.90
  minimum_specificity: 0.90
  ece_bins: 10
  minimum_scale: 0.05
  maximum_scale: 20.0
  maximum_abs_bias: 20.0
  development_abstention_margin: 0.0
evaluation:
  bootstrap_samples: 2000
  confidence_level: 0.95
deployment:
  input_name: image
  output_name: logit
  opset: 18
  preprocessing: opencv_imread_bgr2rgb_inter_area_stretch_imagenet_nchw_float32_v1
